services:
  - type: web
    name: jobtracker-api
    runtime: docker
    plan: free
    repo: https://github.com/Nithusan2002/jobtracker-api
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: JOBTRACKER_DEMO_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
