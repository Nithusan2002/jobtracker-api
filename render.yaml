services:
  - type: web
    name: jobtracker-api
    runtime: docker
    plan: free
    repo: https://github.com/Nithusan2002/jobtracker-api
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtracker-db
          property: connectionString

databases:
  - name: jobtracker-db
    plan: free
    databaseName: jobtracker
    user: jobtracker
    postgresMajorVersion: "17"
