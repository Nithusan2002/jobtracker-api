spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 0

jobtracker:
  demo:
    enabled: ${JOBTRACKER_DEMO_ENABLED:false}
    reset-interval: PT30M
    max-applications: 100
    requests-per-minute: 120
    writes-per-minute: 20

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
